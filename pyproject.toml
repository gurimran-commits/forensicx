[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensicx"
version = "0.1.0"
description = "Digital forensics API and dashboard backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.0,<3.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0,<3.0",
    "starlette>=0.36,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["forensicx*"]

[tool.pytest.ini_options]
testpaths = ["forensicx/tests"]
