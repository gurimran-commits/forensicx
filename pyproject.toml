[project]
name = "forensicx"
version = "0.1.0"
description = "ForensicX AI-powered DFIR platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.137.0",
  "SQLAlchemy>=2.0.51",
  "alembic>=1.18.5",
  "pydantic>=2.13.0",
  "uvicorn>=0.49.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
